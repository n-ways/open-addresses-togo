          type: "string"
        after:
          type: ["string", "null"]
        limit:
          type: "integer"
        count:
          type: "integer"
        next:
          type: ["string", "null"]
        results:
          type: "array"
          items:
            "$ref": "#/components/schemas/RegistryRow"
      required: ["zone", "after", "limit", "count", "next", "results"]
    AreaDetail:
      allOf:
        - "$ref": "#/components/schemas/Area"
        - type: "object"
          properties:
            codes:
              type: "integer"
            byStatus:
              type: "object"
            numbers:
              type: "object"
              properties:
                lowest:
                  type: ["integer", "null"]
                highest:
                  type: ["integer", "null"]
                tailReserveFrom:
                  type: "integer"
                free:
                  type: "integer"
              required: ["lowest", "highest", "tailReserveFrom", "free"]
          required: ["codes", "byStatus"]
    AreaSearch:
      type: "object"
      properties:
