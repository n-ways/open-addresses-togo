components:
  schemas:
    Error:
      type: "object"
      properties:
        error:
          type: "object"
          properties:
            code:
              type: "string"
            message:
              type: "string"
            existing:
              "$ref": "#/components/schemas/Card"
          required: ["code", "message"]
      required: ["error"]
    Point:
      type: "object"
      properties:
        lat:
          type: "number"
        lng:
          type: "number"
      required: ["lat", "lng"]
    Area:
      type: "object"
      properties:
        key:
          type: "string"
        index:
          type: "integer"
        kind:
          type: "string"
          enum: ["lome-quartier", "canton", "cell"]
        plateName:
          type: "string"
        officialName:
          type: ["string", "null"]
        aliases:
          type: "array"
          items:
            type: "string"
        prefecture:
          type: ["string", "null"]
        region:
          type: ["string", "null"]
        zone:
          type: "string"
        place:
          type: "string"
        numbered:
          type: "boolean"
        nameKey:
          type: ["string", "null"]
        nameId:
          type: ["integer", "null"]
        blocks:
          type: "array"
          items:
            type: "array"
            items:
              type: "integer"
            minItems: 2
            maxItems: 2
        numberLength:
          type: ["integer", "null"]
        nameProvisional:
          type: "boolean"
        officialSystem:
          type: ["string", "null"]
        point:
          "$ref": "#/components/schemas/Point"
        box:
          type: "array"
          items:
            type: "number"
          minItems: 4
          maxItems: 4
          description: "west, south, east, north"
        canton:
          type: ["object", "null"]
        cells:
          type: "array"
          items:
            type: "string"
        codes:
          type: "integer"
      required: ["key", "index", "kind", "plateName", "zone", "place", "numbered", "blocks", "point", "box"]
    RegistryRow:
      type: "object"
      properties:
        machine:
          type: "string"
        home:
          type: "string"
        written:
          type: "string"
        zone:
          type: "string"
        official_name:
          type: "string"
        number:
          type: "string"
        check:
          type: "string"
        status:
          type: "string"
        issued:
          type: "string"
        issued_at:
          type: "string"
        entrance_lat:
          type: "string"
        entrance_lng:
          type: "string"
        entrance_kind:
          type: "string"
        spot_code:
          type: "string"
        official_address:
          type: "string"
        class:
          type: "string"
        use:
          type: "string"
        kind:
          type: "string"
        structures:
          type: "string"
        floor_area_m2:
          type: "string"
        rule:
          type: "string"
        estate:
          type: "string"
      required: ["machine", "home", "written", "zone", "official_name", "number", "check", "status", "issued", "issued_at", "entrance_lat", "entrance_lng", "entrance_kind", "spot_code", "official_address", "class", "use", "kind", "structures", "floor_area_m2", "rule", "estate"]
      description: "A registry row exactly as published (all values are text)."
    Card:
      type: "object"
      properties:
        machine:
          type: "string"
        remembered:
          type: "string"
        home:
          type: "string"
        spoken:
          type: "string"
        plateName:
          type: "string"
        number:
          type: "integer"
        check:
          type: "integer"
          description: "for systems only; people never see it"
        status:
          type: "string"
          enum: ["provisional", "confirmed", "retired"]
        issued:
          type: "string"
          enum: ["bulk", "on-demand"]
        issuedAt:
          type: "string"
          format: "date-time"
        officialAddress:
          type: ["string", "null"]
        place:
          type: "string"
        entrance:
          type: "object"
          properties:
            lat:
              type: "number"
            lng:
              type: "number"
            kind:
              type: "string"
              enum: ["centre", "door", "gate"]
          required: ["lat", "lng", "kind"]
        spotCode:
          type: "string"
        plusCode:
          type: "string"
        area:
          "$ref": "#/components/schemas/Area"
        zone:
          type: "object"
          properties:
            key:
              type: "string"
            name:
              type: "string"
          required: ["key", "name"]
        building:
          type: "object"
          properties:
            class:
              type: ["string", "null"]
            use:
              type: ["string", "null"]
            kind:
              type: ["string", "null"]
            structures:
              type: "integer"
            floorAreaM2:
              type: "number"
            rule:
              type: ["string", "null"]
            estate:
              type: ["string", "null"]
          required: ["class", "use", "kind", "structures", "floorAreaM2", "rule", "estate"]
        registry:
          "$ref": "#/components/schemas/RegistryRow"
        credit:
          type: "string"
        distanceM:
          type: "number"
      required: ["machine", "remembered", "home", "number", "check", "status", "issued", "issuedAt", "entrance", "spotCode", "area", "zone", "building", "registry", "credit"]
    Brief:
      type: "object"
      properties:
        machine:
          type: "string"
        remembered:
          type: "string"
        status:
          type: "string"
        entrance:
          type: "object"
          properties:
            lat:
              type: "number"
            lng:
              type: "number"
            kind:
              type: "string"
          required: ["lat", "lng", "kind"]
        spotCode:
          type: "string"
        officialAddress:
          type: ["string", "null"]
        area:
          type: "string"
        distanceM:
          type: "number"
      required: ["machine", "remembered", "status", "entrance", "spotCode", "officialAddress", "area", "distanceM"]
    Health:
      type: "object"
      properties:
        status:
          type: "string"
        country:
          type: "string"
        codes:
          type: "integer"
        registryExported:
          type: "string"
        changedSinceImport:
          type: "boolean"
        issuing:
          type: "boolean"
      required: ["status", "country", "codes", "registryExported", "changedSinceImport", "issuing"]
    Info:
      type: "object"
      properties:
        country:
          type: "string"
        name:
          type: "string"
        api:
          type: "string"
        engine:
          type: "string"
        spec:
          type: "string"
        registryExported:
          type: "string"
        importedAt:
          type: "string"
        counts:
          type: "object"
        zones:
          type: "array"
          items:
            type: "object"
        licences:
          type: "object"
        credit:
          type: "string"
        creditUrl:
          type: "string"
        issuing:
          type: "boolean"
        issuePerDay:
          type: "integer"
        forms:
          type: "object"
      required: ["country", "name", "api", "engine", "spec", "registryExported", "importedAt", "counts", "zones", "licences", "credit", "creditUrl", "issuing", "issuePerDay", "forms"]
    Find:
      type: "object"
      properties:
        query:
          type: "string"
        kind:
          type: "string"
          enum: ["machine", "remembered", "spot", "official"]
        point:
          "$ref": "#/components/schemas/Point"
        count:
          type: "integer"
        results:
          type: "array"
          items:
            "$ref": "#/components/schemas/Card"
      required: ["query", "kind", "count", "results"]
    At:
      type: "object"
      properties:
        status:
          type: "string"
          enum: ["found", "none"]
        distanceM:
          type: "number"
        code:
          "$ref": "#/components/schemas/Card"
        area:
          "$ref": "#/components/schemas/Area"
        newCodeArea:
          type: ["string", "null"]
        spotCode:
          type: "string"
      required: ["status", "area"]
    Near:
      type: "object"
      properties:
        point:
          "$ref": "#/components/schemas/Point"
        radiusM:
          type: "number"
        count:
          type: "integer"
        more:
          type: "boolean"
        results:
          type: "array"
          items:
            "$ref": "#/components/schemas/Brief"
      required: ["point", "radiusM", "count", "more", "results"]
    Verify:
      type: "object"
      properties:
        code:
          type: "string"
        syntax:
          type: "boolean"
        checkDigit:
          type: ["boolean", "null"]
        inBlocks:
          type: ["boolean", "null"]
        issued:
          type: "boolean"
        status:
          type: ["string", "null"]
        machine:
          type: ["string", "null"]
        remembered:
          type: "string"
        reason:
          type: "string"
      required: ["code", "syntax", "checkDigit", "inBlocks", "issued", "status", "machine"]
    Spot:
      type: "object"
      properties:
        spotCode:
          type: "string"
        point:
          "$ref": "#/components/schemas/Point"
        centre:
          "$ref": "#/components/schemas/Point"
        cellM:
          type: "array"
          items:
            type: "number"
        area:
          type: "string"
      required: ["spotCode", "point", "centre", "cellM", "area"]
    SpotDecode:
      type: "object"
      properties:
        spotCode:
          type: "string"
        centre:
          "$ref": "#/components/schemas/Point"
        cellM:
          type: "array"
          items:
            type: "number"
        frame:
          "$ref": "#/components/schemas/Area"
      required: ["spotCode", "centre", "cellM", "frame"]
    Zones:
      type: "object"
      properties:
        count:
          type: "integer"
        zones:
          type: "array"
          items:
            type: "object"
            properties:
              key:
                type: "string"
              name:
                type: "string"
              region:
                type: ["string", "null"]
              codes:
                type: "integer"
              areas:
                type: "integer"
              numberedAreas:
                type: "integer"
            required: ["key", "name", "region", "codes", "areas", "numberedAreas"]
      required: ["count", "zones"]
    Zone:
      type: "object"
      properties:
        key:
          type: "string"
        name:
          type: "string"
        region:
          type: ["string", "null"]
        codes:
          type: "integer"
        areas:
          type: "array"
          items:
            "$ref": "#/components/schemas/Area"
      required: ["key", "name", "region", "codes", "areas"]
