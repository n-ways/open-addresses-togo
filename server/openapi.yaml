          type: "string"
        nameKey:
          type: "string"
        match:
          type: "string"
          enum: ["name", "prefix"]
        count:
          type: "integer"
        results:
          type: "array"
          items:
            "$ref": "#/components/schemas/Area"
      required: ["name", "nameKey", "match", "count", "results"]
    IssueRequest:
      type: "object"
      properties:
        lat:
          type: "number"
        lng:
          type: "number"
        outline:
          type: "array"
          items:
            type: "array"
            items:
              type: "number"
            minItems: 2
            maxItems: 2
          maxItems: 500
          description: "the building as drawn, [lng, lat] points, open or closed"
