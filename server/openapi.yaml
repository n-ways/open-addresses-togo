# N-Ways Addressing for Togo: the registry API (OpenAPI 3.1).
# Every example is a real response of the server on the published registry (docs/api.md).
openapi: "3.1.0"
info:
  title: "N-Ways Addressing for Togo: registry API"
  version: "1"
  summary: "Look up, verify and (on the designated issuer) issue the addresses of N-Ways Addressing for Togo."
  description: "Served by server/ of https://github.com/n-ways/open-addresses-togo. Reads are open; issuing and changing codes need a bearer key and are done by one designated issuer only. Errors are {\"error\": {\"code\", \"message\"}}. Credit: N-Ways Addressing for Togo, © N-WAYS LIMITED (nways.ng). Data ODbL 1.0, code Apache 2.0."
  contact:
    name: "N-WAYS LIMITED"
    email: "hello@nways.ng"
    url: "https://nways.ng"
  license:
    name: "Apache-2.0"
    identifier: "Apache-2.0"
servers:
  - url: "http://localhost:8080"
    description: "a local deployment"
tags:
  - name: "read"
  - name: "issue"
paths:
