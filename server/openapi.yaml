  "/v1/codes":
    post:
      summary: "Issue a code for a new compound or another door (issuer only)"
      description: "The point must be in Togo: in a quartier or canton outline, or in no outline but with a spot code (a compound in a gap between outlines, SPEC 5). Any other point is refused (422 outside), and so is a point more than 300 m across the national border (OpenStreetMap admin_level 2), even where a zone outline or a spot code reaches it."
      operationId: "issueCode"
      security:
        - issuerKey: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/IssueRequest"
            examples:
              point:
                value:
                  lat: 6.132
                  lng: 1.224
              door:
                value:
                  lat: 6.13185
                  lng: 1.22355
                  of: "TG-FRJ-1058-2"
